<!doctype html>
<html lang="en" class="no-js">
  <head>
    <!-- Title and Icon -->
    <title id="landingTitle">
      MiroTalk a Free Secure Video Calls, Chat & Screen Sharing.
    </title>
    <link id="shortcutIcon" rel="shortcut icon" href="../images/logo.svg" />
    <link
      id="appleTouchIcon"
      rel="apple-touch-icon"
      href="../images/mirotalk-logo.png"
    />

    <!-- PWA: lets mobile browsers "Add to Home Screen" as a standalone
         app (own icon, no browser address bar) instead of a bare
         bookmark. apple-touch-icon above must be a PNG, not the SVG it
         was before - iOS doesn't reliably render SVG touch icons. -->
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#3b8ac4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="DORA NIHONGO" />

    <!-- Meta Information -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="MiroTalk powered by WebRTC, Real-time Simple Secure Fast video calls, chat and screen sharing capabilities in the browser, from your mobile or desktop."
    />

    <!-- https://ogp.me -->
    <meta property="og:type" content="{{OG_TYPE}}" />
    <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:url" content="{{OG_URL}}" />

    <!-- xss -->
    <script defer src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>

    <!-- https://cdnjs.com/libraries/font-awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />

    <!-- StyleSheet -->
    <link rel="stylesheet" href="../css/_tokens.css" />
    <link rel="stylesheet" href="../css/landing.css" />
    <link rel="stylesheet" href="../css/newcall.css" />
    <link rel="stylesheet" href="../css/topbar.css" />

    <!-- https://animate.style 4 using for swal fadeIn-Out -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <!-- sweetalert -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.8"
    ></script>
  </head>
  <body class="has-animations">
    <div id="snow-container"></div>
    <div class="body-wrap">
      <header class="top-bar">
        <div class="top-bar-brand">
          <img
            class="top-bar-logo"
            src="https://i.ibb.co/kgWx9gtZ/Logo-Dora.png"
            alt="DORA NIHONGO"
          />
          <span class="top-bar-title">DORA NIHONGO</span>
        </div>
        <button id="accountBtn" class="account-btn" aria-label="Tài khoản">
          <img id="accountAvatar" class="account-avatar" alt="Avatar" />
        </button>
      </header>

      <main class="site-content">
        <section
          class="cta section center-content-mobile reveal-from-bottom"
        >
          <div class="container">
            <div class="cta-inner section-inner cta-split br-12">
              <div class="cta-slogan">
                <h3 id="appJoinDescription" class="m-0">
                  NHẬP MÃ PHÒNG HỌC
                </h3>
              </div>
              <div class="cta-action">
                <div class="mb-0">
                  <label class="form-label screen-reader" for="roomName"
                    >MiroTalk-P2P</label
                  >
                  <div class="form-group-desktop">
                    <div class="room-input-wrap">
                      <input
                        id="roomName"
                        class="form-input"
                        type="text"
                        value="mirotalk"
                        maxlength="64"
                      />
                      <button
                        id="genRoomButton"
                        class="room-gen-btn fas fa-arrows-rotate"
                      ></button>
                    </div>
                    <button
                      id="joinRoomButton"
                      class="button button-primary br-6"
                    >
                      VÀO PHÒNG
                    </button>
                  </div>
                </div>
                <div id="lastRoomContainer" class="last-room">
                  <span id="appJoinLastRoom">Phòng học gần đây:</span>
                  <a id="lastRoom"></a>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <footer class="bottom-bar">
        <span class="bottom-bar-copyright">© 2026 DORA VIETNAM</span>
        <a
          class="bottom-bar-github"
          href="https://github.com/miroslavpejic85/mirotalk"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub"
        >
          <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
                 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53
                 .63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
                 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09
                 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65
                 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
        </a>
      </footer>
    </div>

    <!-- Bảng thông tin tài khoản - ẩn mặc định, mở khi bấm accountBtn -->
    <div id="accountPanelOverlay" class="account-panel-overlay hidden">
      <div id="accountPanel" class="account-panel">
        <div class="account-panel-header">
          <h2>Tài khoản của tôi</h2>
          <button
            id="accountPanelClose"
            class="account-panel-close"
            aria-label="Đóng"
          >
            ✕
          </button>
        </div>

        <div class="account-panel-body">
          <div id="accountInfoView">
            <div class="account-field">
              <label>Tên hiển thị</label>
              <div id="accountDisplayName" class="account-field-value">-</div>
            </div>
            <div class="account-field">
              <label>Vai trò</label>
              <div id="accountRole" class="account-field-value">-</div>
            </div>
            <button
              id="accountChangePasswordBtn"
              type="button"
              class="account-secondary-btn"
            >
              Đổi mật khẩu
            </button>
          </div>

          <div id="accountChangePasswordView" class="hidden">
            <div class="account-panel-subheader">
              <h3>Đổi mật khẩu</h3>
              <button id="accountChangePasswordBack" type="button">
                Quay lại
              </button>
            </div>
            <div
              id="accountChangePasswordError"
              class="account-error"
              role="alert"
            ></div>
            <form id="accountChangePasswordForm" novalidate>
              <div class="account-field">
                <label for="accountOldPassword">Mật khẩu hiện tại</label>
                <input id="accountOldPassword" type="password" required />
              </div>
              <div class="account-field">
                <label for="accountNewPassword">Mật khẩu mới</label>
                <input id="accountNewPassword" type="password" required />
              </div>
              <div class="account-field">
                <label for="accountConfirmPassword"
                  >Nhập lại mật khẩu mới</label
                >
                <input id="accountConfirmPassword" type="password" required />
              </div>
              <button
                id="accountChangePasswordSubmit"
                type="submit"
                class="account-primary-btn"
              >
                Lưu thay đổi
              </button>
            </form>
          </div>
        </div>

        <div class="account-panel-footer">
          <button id="accountLogoutBtn" type="button" class="account-logout-btn">
            Đăng xuất
          </button>
        </div>
      </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="../js/supabaseClient.js"></script>

    <script defer src="../js/utils.js"></script>
    <script defer src="../js/common.js"></script>
    <script defer src="../js/accountPanel.js"></script>

    <script defer src="../js/landing.js"></script>
  </body>
</html>
