<!doctype html>
<html lang="en" class="no-js">
  <head>
    <!-- Title and Icon -->
    <title id="landingTitle">
      MiroTalk a Free Secure Video Calls, Chat & Screen Sharing.
    </title>
    <link id="shortcutIcon" rel="shortcut icon" href="../images/logo.svg" />
    <link
      id="appleTouchIcon"
      rel="apple-touch-icon"
      href="../images/mirotalk-logo.png"
    />

    <!-- PWA: lets mobile browsers "Add to Home Screen" as a standalone
         app (own icon, no browser address bar) instead of a bare
         bookmark. apple-touch-icon above must be a PNG, not the SVG it
         was before - iOS doesn't reliably render SVG touch icons. -->
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#3b8ac4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DORA NIHONGO" />

    <!-- Meta Information -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="MiroTalk powered by WebRTC, Real-time Simple Secure Fast video calls, chat and screen sharing capabilities in the browser, from your mobile or desktop."
    />

    <!-- https://ogp.me -->
    <meta property="og:type" content="{{OG_TYPE}}" />
    <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:url" content="{{OG_URL}}" />

    <!-- xss -->
    <script defer src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>

    <!-- https://cdnjs.com/libraries/font-awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />

    <!-- StyleSheet -->
    <link rel="stylesheet" href="../css/_tokens.css" />
    <link rel="stylesheet" href="../css/landing.css" />
    <link rel="stylesheet" href="../css/newcall.css" />

    <!-- https://animate.style 4 using for swal fadeIn-Out -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <!-- sweetalert -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.8"
    ></script>
  </head>
  <body class="has-animations">
    <div id="snow-container"></div>
    <div class="body-wrap">
      <main class="site-content">
        <section
          class="cta section center-content-mobile reveal-from-bottom"
        >
          <div class="container">
            <div class="cta-inner section-inner cta-split br-12">
              <div class="cta-slogan">
                <h3 id="appJoinDescription" class="m-0">
                  NHẬP MÃ PHÒNG HỌC
                </h3>
              </div>
              <div class="cta-action">
                <div class="mb-0">
                  <label class="form-label screen-reader" for="roomName"
                    >MiroTalk-P2P</label
                  >
                  <div class="form-group-desktop">
                    <div class="room-input-wrap">
                      <input
                        id="roomName"
                        class="form-input"
                        type="text"
                        value="mirotalk"
                        maxlength="64"
                      />
                      <button
                        id="genRoomButton"
                        class="room-gen-btn fas fa-arrows-rotate"
                      ></button>
                    </div>
                    <button
                      id="joinRoomButton"
                      class="button button-primary br-6"
                    >
                      VÀO PHÒNG
                    </button>
                  </div>
                </div>
                <div id="lastRoomContainer" class="last-room">
                  <span id="appJoinLastRoom">Phòng học gần đây:</span>
                  <a id="lastRoom"></a>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script defer src="../js/utils.js"></script>
    <script defer src="../js/common.js"></script>

    <script defer src="../js/landing.js"></script>
  </body>
</html>
