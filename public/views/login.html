<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - DORA ONLINE</title>
    <meta name="robots" content="noindex, nofollow" />

    <link rel="shortcut icon" href="../images/dora-logo.png" />
    <link rel="apple-touch-icon" href="../images/dora-logo.png" />

    <!-- PWA: cho phép "Thêm vào màn hình chính" ngay từ trang login -
         giờ đây đây là trang đầu tiên người chưa đăng nhập gặp trên di
         động, cần đủ thẻ giống landing.html thì trình duyệt mới coi là
         cài được (apple-touch-icon ở trên phải là PNG, không phải SVG -
         iOS không render SVG làm touch icon đáng tin cậy). -->
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#0b1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="DORA ONLINE" />

    <!-- StyleSheet - dùng chung token màu với các trang khác, còn lại
         là CSS riêng của trang login, không đụng tới landing.css/client.css -->
    <link rel="stylesheet" href="../css/_tokens.css" />
    <link rel="stylesheet" href="../css/login.css" />

    <!-- Supabase JS SDK -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <!-- Hiện khi đang kiểm tra phiên đăng nhập cũ lúc tải trang -->
    <div id="loginLoading" class="login-loading">
      Đang kiểm tra phiên đăng nhập...
    </div>

    <main id="authCard" class="auth-card hidden state-login">
      <div class="auth-curve" aria-hidden="true"></div>

      <img
        class="auth-logo auth-logo-left"
        src="https://i.ibb.co/GvC0pFmy/Logo-tr-ng.png"
        alt="DORA"
      />
      <img
        class="auth-logo auth-logo-right"
        src="https://i.ibb.co/kgWx9gtZ/Logo-Dora.png"
        alt="DORA"
      />

      <!-- Nửa trái -->
      <div class="auth-slot auth-slot-left">
        <div class="auth-message" data-panel="login">
          <h2>Xin chào</h2>
          <p>Đăng nhập để vào phòng học trực tuyến DORA ONLINE.</p>
        </div>

        <div class="auth-form" data-panel="changepw">
          <h1>Đổi mật khẩu</h1>

          <form id="changePasswordForm" novalidate>
            <div class="auth-field auth-field-password">
              <input
                id="newPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Mật khẩu mới"
                required
              />
              <button
                type="button"
                class="auth-toggle-password"
                data-target="newPassword"
                aria-label="Hiện mật khẩu"
              ></button>
            </div>
            <div class="auth-field auth-field-password">
              <input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Nhập lại mật khẩu mới"
                required
              />
              <button
                type="button"
                class="auth-toggle-password"
                data-target="confirmPassword"
                aria-label="Hiện mật khẩu"
              ></button>
            </div>
            <button
              id="changePasswordSubmitBtn"
              type="submit"
              class="auth-submit"
            >
              XÁC NHẬN
            </button>
          </form>

          <div id="changePasswordError" class="auth-error" role="alert"></div>
        </div>
      </div>

      <!-- Nửa phải -->
      <div class="auth-slot auth-slot-right">
        <div class="auth-form" data-panel="login">
          <h1>Đăng nhập</h1>

          <form id="loginForm" novalidate>
            <div class="auth-field">
              <input
                id="loginUsername"
                type="text"
                autocomplete="off"
                placeholder="Tài khoản"
                required
              />
            </div>
            <div class="auth-field auth-field-password">
              <input
                id="loginPassword"
                type="password"
                autocomplete="off"
                placeholder="Mật khẩu"
                required
              />
              <button
                type="button"
                class="auth-toggle-password"
                data-target="loginPassword"
                aria-label="Hiện mật khẩu"
              ></button>
            </div>
            <button id="loginSubmitBtn" type="submit" class="auth-submit">
              ĐĂNG NHẬP
            </button>
          </form>

          <div id="loginError" class="auth-error" role="alert"></div>
        </div>

        <div class="auth-message" data-panel="changepw">
          <h2>Gần xong rồi!</h2>
          <p>Đổi mật khẩu là vào được luôn!</p>
        </div>
      </div>
    </main>

    <script defer src="../js/supabaseClient.js"></script>
    <script defer src="../js/login.js"></script>
    <script>
      // Đăng ký service worker để trang này cũng "cài được" (Add to
      // Home Screen) trên di động - không load chung common.js vì
      // authGuard trong đó sẽ redirect ngay trên chính trang login.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
